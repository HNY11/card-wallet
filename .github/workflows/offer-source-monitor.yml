name: Monitor card offer sources

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-offer-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check official issuer pages
        id: monitor
        run: python scripts/check_offer_sources.py

      - name: Save latest source-check fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_checks.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh offer source checks"
            git push
          fi

      - name: Report source changes for manual review
        if: steps.monitor.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('offer-source-changes.md', 'utf8');
            const title = '[Offer Monitor] Review changed issuer pages';
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: []
              });
            }
